apply plugin: 'com.android.application'

// Release signing lives outside the repo: keystore.properties (git-ignored) points at the keystore
// and holds its passwords. Without it, only debug builds are possible.
def keystoreFile = rootProject.file('keystore.properties')
def keystore = new Properties()
if (keystoreFile.exists()) keystoreFile.withInputStream { keystore.load(it) }

android {
    namespace 'io.github.federicomameli1.sugarglass'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.federicomameli1.sugarglass'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.1.0'
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile file(keystore['storeFile'])
                storePassword keystore['storePassword']
                keyAlias keystore['keyAlias']
                keyPassword keystore['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig keystoreFile.exists() ? signingConfigs.release : null
        }
        // Installs next to the real app, with fake readings in the settings for testing the look
        debug {
            applicationIdSuffix '.debug'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
