name: Build

on:
  push:
  pull_request:

# Read-only token: this workflow builds and tests, it never writes to the repo
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (tag in the comment): a moved tag cannot change what runs here
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fails if gradle-wrapper.jar is not an official Gradle one, so a PR cannot slip in a tampered wrapper
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew
      - run: ./gradlew test assembleDebug
      # Only for the repo's own pushes: a pull request's build is never offered as a download here
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sugarglass-debug
          path: app/build/outputs/apk/debug/app-debug.apk
